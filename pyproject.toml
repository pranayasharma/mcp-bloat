[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-bloat"
version = "0.6.1"
description = "Audit how many tokens your MCP servers eat from your context window — before your agent pays for them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Pranaya Sharma" }]
keywords = ["mcp", "model-context-protocol", "tokens", "context-window", "claude", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=1.2",
    "rich>=13",
]

[project.optional-dependencies]
accurate = ["tiktoken>=0.7"]
dev = ["build>=1.0"]

[project.scripts]
mcp-bloat = "mcp_bloat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bloat"]

[project.urls]
Homepage = "https://github.com/pranayasharma/mcp-bloat"
